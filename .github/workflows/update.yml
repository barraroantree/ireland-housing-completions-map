name: Update map

# CSO publishes NDQ09 quarterly, but the date moves, so check monthly.
# The monthly last_checked.txt commit also keeps the schedule alive
# (GitHub disables scheduled workflows after 60 days without repo activity).
on:
  schedule:
    - cron: "0 7 1 * *"   # 07:00 UTC on the 1st of each month
  workflow_dispatch:
    inputs:
      force:
        description: "Rebuild the map even if NDQ09 is unchanged"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::csodata
            any::dplyr
            any::sf
            any::leaflet
            any::htmlwidgets

      - name: Rebuild and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          ./publish.sh ${{ inputs.force && '--force' || '' }}
